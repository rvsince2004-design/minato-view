<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>波風ミナト — 黄色い閃光</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background-color: #050505; color: white; font-family: sans-serif; }
    
    #minato-canvas {
      display: block; width: 100vw; height: 100vh;
      position: fixed; top: 0; left: 0; z-index: 10;
    }
    
    /* Instruction text */
    #hint {
      position: fixed; bottom: 20px; width: 100%; text-align: center;
      z-index: 20; opacity: 0.6; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="hint">Scroll down to unleash the Rasengan</div>
  <canvas id="minato-canvas"></canvas>
  <div style="height: 400vh;"></div> <!-- Scroll space -->

  <script>
    // ... (All previous JavaScript code remains the same) ...
    /* ───────────────────────── Helpers ───────────────────────── */
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const rand = (a, b) => a + Math.random() * (b - a);
    const window4 = (p, a, b, c, d) => p < a || p > d ? 0 : p < b ? (p - a) / (b - a) : p > c ? 1 - (p - c) / (d - c) : 1;

    const canvas = document.getElementById('minato-canvas');
    const ctx = canvas.getContext('2d');
    let bounds = { width: window.innerWidth, height: window.innerHeight };
    canvas.width = bounds.width; canvas.height = bounds.height;

    let scrollProgress = 0;
    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = maxScroll > 0 ? clamp(window.scrollY / maxScroll) : 0;
      // Fade out hint when scrolling
      document.getElementById('hint').style.opacity = Math.max(0, 1 - scrollProgress * 5);
    });

    /* Rasengan Logic (Stage 4) */
    let rasenganAngle = 0;
    function drawRasengan(opacity) {
      if (opacity <= 0) return;
      // Auto-move in center if no mouse movement
      const px = window.innerWidth / 2;
      const py = window.innerHeight / 2;
      
      // Draw spinning orb
      rasenganAngle += 0.15;
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(px, py);
      ctx.rotate(rasenganAngle);
      ctx.strokeStyle = '#00E5FF';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 50, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const p = scrollProgress;
      
      // STAGE 4: Rasengan (appears when p > 0.7)
      drawRasengan(window4(p, 0.7, 0.8, 1.0, 1.0));
      
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
