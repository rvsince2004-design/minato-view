<!DOCTYPE html>
<html>
<body style="margin:0; background:#050505; overflow:hidden;">
  <canvas id="c"></canvas>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth;
    c.height = window.innerHeight;

    let frame = 0;
    let rasenganRadius = 0;

    function render() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, c.width, c.height);

      const centerX = c.width / 2;
      const centerY = c.height / 2;

      // 1. Calculate Hand Positions
      // Start at -200 and +200, move toward center (50 pixels apart)
      let hand1Offset = Math.min(frame * 2, 150); 
      let hand2Offset = Math.min(frame * 2, 150);

      // 2. Draw "Arms" (Simple glowing lines)
      ctx.strokeStyle = '#FFD700'; // Yellow flash color
      ctx.lineWidth = 15;
      ctx.lineCap = 'round';
      
      // Left Arm
      ctx.beginPath();
      ctx.moveTo(0, centerY + 100);
      ctx.lineTo(centerX - 60 + hand1Offset, centerY);
      ctx.stroke();

      // Right Arm
      ctx.beginPath();
      ctx.moveTo(c.width, centerY + 100);
      ctx.lineTo(centerX + 60 - hand2Offset, centerY);
      ctx.stroke();

      // 3. Create Rasengan when hands get close
      if (frame > 75) {
        if (rasenganRadius < 60) rasenganRadius += 0.8;
        
        // Glow effect
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#00E5FF';
        
        // Spinning Rasengan
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(frame * 0.2);
        ctx.strokeStyle = '#00E5FF';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, rasenganRadius, 0, Math.PI * 2);
        ctx.stroke();
        
        // Inner swirl
        ctx.beginPath();
        ctx.moveTo(-rasenganRadius*0.7, 0);
        ctx.lineTo(rasenganRadius*0.7, 0);
        ctx.stroke();
        ctx.restore();
        
        ctx.shadowBlur = 0; // Reset glow
      }

      frame++;
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
